<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 280" role="img" aria-label="Lumenore AI">
  <defs>
    <linearGradient id="lumL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FC8D6" />
      <stop offset="100%" stop-color="#3F8DA0" />
    </linearGradient>
    <linearGradient id="lumAI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FB6FF" />
      <stop offset="55%" stop-color="#A88EFF" />
      <stop offset="100%" stop-color="#FF8FB6" />
    </linearGradient>
  </defs>
  <!-- Stylized "L" mark -->
  <g transform="translate(20,30)">
    <path d="M0 0 H44 V160 H150 V200 H0 Z" fill="#3E4A66" />
    <rect x="0" y="170" width="170" height="30" fill="url(#lumL)" opacity="0.85" />
    <rect x="0" y="200" width="170" height="14" fill="url(#lumL)" opacity="0.55" />
  </g>
  <!-- Wordmark "UMENORE" -->
  <g fill="#3E4A66" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="170" letter-spacing="8">
    <text x="220" y="200">UMENORE</text>
  </g>
  <!-- AI badge -->
  <g transform="translate(900,18)">
    <circle cx="50" cy="50" r="50" fill="url(#lumAI)" />
    <text x="50" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="42" fill="#FFFFFF">AI</text>
  </g>
</svg>
